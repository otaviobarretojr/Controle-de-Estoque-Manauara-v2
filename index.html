<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque Manauara</title><style>body{margin:0;font:14px Arial;background:#f5f7fb;color:#0b1530}header{height:64px;background:#fff;border-bottom:1px solid #dde3ee;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{font-weight:800;font-size:18px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#1737b8;color:#fff}.secondary{background:#fff;border:1px solid #dce2ec}.app{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 64px)}aside{background:#fff;border-right:1px solid #dde3ee;padding:22px 12px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:12px;margin:3px 0;color:#526079;cursor:pointer}.nav button.active{background:#eef1ff;color:#1737b8;font-weight:800}main{padding:34px}.view{display:none}.view.active{display:block}h1{font-size:30px;margin:0 0 6px}.sub{color:#748098}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.card,.panel{background:#fff;border:1px solid #e0e5ee;border-radius:13px}.card{padding:17px}.card b{font-size:24px;display:block;margin-top:12px}.panel{overflow:auto}.toolbar{display:flex;gap:8px;padding:12px;border-bottom:1px solid #e7ebf2}.input,select{padding:10px;border:1px solid #dce2ec;border-radius:8px;background:#fff}.input{flex:1}table{width:100%;border-collapse:collapse;min-width:820px}th,td{padding:12px 14px;border-top:1px solid #edf0f5;text-align:left}th{font-size:11px;color:#8590a5}.good{color:#0a9a69;font-weight:700}.bad{color:#df3047;font-weight:700}.warn{color:#b87700;font-weight:700}.muted{color:#8b95a8;font-size:12px}.empty{padding:44px;text-align:center;color:#7c879b}@media(max-width:800px){.app{display:block}aside{border-right:0;border-bottom:1px solid #dde3ee}.nav{display:grid;grid-template-columns:repeat(3,1fr)}main{padding:18px}.cards{grid-template-columns:1fr 1fr}}</style></head><body><header><div class="brand">S &nbsp; Estoque Manauara</div><div><button class="btn primary" onclick="invFile.click()">↑ Importar inventário</button><input id="invFile" type="file" accept=".xls,.html,.htm" hidden></div></header><div class="app"><aside><div class="nav"><button class="active" data-v="overview">▦ Visão geral</button><button data-v="products">≡ Produtos</button><button data-v="presales">◈ Pré-vendas</button><button data-v="requests">↗ Solicitações</button></div></aside><main><section id="overview" class="view active"><h1>Visão geral do estoque</h1><div class="sub">Inventário geral e disponibilidade atual.</div><div id="ovCards" class="cards"></div><div class="panel"><div id="ovTable"></div></div></section><section id="products" class="view"><h1>Produtos</h1><div class="sub">Produtos importados do inventário.</div><div class="panel" style="margin-top:22px"><div class="toolbar"><input id="prodQ" class="input" placeholder="Buscar produto, SKU ou referência"></div><div id="prodTable"></div></div></section><section id="presales" class="view"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h1>Pré-vendas</h1><div class="sub">Demanda reservada comparada ao saldo físico.</div></div><div><button class="btn primary" onclick="preFile.click()">↑ Importar pré-vendas</button><input id="preFile" type="file" accept=".csv" hidden></div></div><div id="preCards" class="cards"></div><div class="panel"><div class="toolbar"><input id="preQ" class="input" placeholder="Buscar modelo, memória ou cor"><select id="preStatus"><option value="all">Todos</option><option value="good">Atende</option><option value="bad">Com déficit</option><option value="unlinked">Não vinculado</option></select></div><div id="preTable"></div></div></section><section id="requests" class="view"><h1>Solicitações</h1><div class="sub">Déficits enviados para abastecimento.</div><div class="panel" style="margin-top:22px"><div id="reqTable"></div></div></section></main></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],K='estoque-manauara-v2';let S=JSON.parse(localStorage.getItem(K)||'{"inventory":[],"presales":[],"links":{},"requests":[]}');function save(){localStorage.setItem(K,JSON.stringify(S));render()}function n(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/galaxy/g,'').replace(/roxo escuro/g,'roxo').replace(/\bgb\b/g,'').replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}function num(v){v=String(v??'').replace(/[^0-9,.-]/g,'');if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.');else v=v.replace(',','.');return Number(v)||0}function parseInv(txt){let d=new DOMParser().parseFromString(txt,'text/html'),rows=[...d.querySelectorAll('tr')],out=[];for(const tr of rows){let c=[...tr.querySelectorAll('th,td')].map(x=>x.textContent.trim());if(c.length<6)continue;let low=c.map(n),di=low.findIndex(x=>x.includes('descricao')),ci=low.findIndex(x=>x==='codigo'||x.includes('codigo')),ri=low.findIndex(x=>x.includes('referencia'));if(di>=0){S._hdr={d:di,c:ci,r:ri,s:low.findIndex(x=>x==='saldo'),u:low.findIndex(x=>x.includes('custo unit')),t:low.findIndex(x=>x.includes('subtotal'))};continue}let h=S._hdr;if(!h)continue;let name=c[h.d];if(!name||n(name)==='descricao')continue;let stock=h.s>=0?num(c[h.s]):0,unit=h.u>=0?num(c[h.u]):0,sub=h.t>=0?num(c[h.t]):0;if(!stock&&unit>0&&sub>0)stock=Math.round(sub/unit);out.push({code:h.c>=0?c[h.c]:'',name,ref:h.r>=0?c[h.r]:'',stock,unit,sub})}delete S._hdr;return out}function csv(txt){let lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);if(!lines.length)return[];let sep=lines[0].split(';').length>lines[0].split(',').length?';':',';let p=line=>{let a=[],x='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'&&line[i+1]==='"'){x+='"';i++}else if(ch==='"')q=!q;else if(ch===sep&&!q){a.push(x);x=''}else x+=ch}a.push(x);return a};let h=p(lines[0]).map(n);return lines.slice(1).map(l=>{let a=p(l),o={};h.forEach((k,i)=>o[k.replace(/ /g,'_')]=a[i]||'');return o})}function key(r){return [n(r.produto),n(r.capacidade),n(r.cor)].join('|')}function groups(){let m={};for(const r of S.presales){let k=key(r);if(!m[k])m[k]={key:k,product:r.produto,capacity:r.capacidade,color:r.cor,count:0};m[k].count++}return Object.values(m)}function match(g){if(S.links[g.key])return S.inventory.find(p=>p.code===S.links[g.key])||null;let target=n(`${g.product} ${g.capacity} ${g.color}`),cap=n(g.capacity),col=n(g.color),best=null,score=0;for(const p of S.inventory){let z=n(p.name),s=0;if(cap&&z.includes(cap))s+=4;if(col&&z.includes(col))s+=4;for(const t of n(g.product).split(' '))if(t.length>1&&z.includes(t))s++;if(z.includes(target)||target.includes(z))s+=8;if(s>score){score=s;best=p}}return score>=8?best:null}function analysis(){return groups().map(g=>{let p=match(g),stock=p?p.stock:0,free=stock-g.count;return{...g,p,stock,free,def:Math.max(0,-free),status:!p?'unlinked':free>=0?'good':'bad'}})}function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function cards(el,arr){$(el).innerHTML=arr.map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b><span class="muted">${x[2]||''}</span></div>`).join('')}function invRows(list){if(!list.length)return'<div class="empty">Importe o inventário para começar.</div>';return`<table><thead><tr><th>Produto</th><th>SKU</th><th>Referência</th><th>Estoque</th><th>Custo</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.code}</td><td>${p.ref}</td><td><b>${p.stock}</b></td><td>${money(p.unit)}</td></tr>`).join('')}</tbody></table>`}function render(){let units=S.inventory.reduce((a,p)=>a+p.stock,0),val=S.inventory.reduce((a,p)=>a+p.sub,0);cards('#ovCards',[['Produtos',S.inventory.length],['Unidades',units],['Valor em estoque',money(val)],['Pré-vendas',S.presales.length]]);$('#ovTable').innerHTML=invRows(S.inventory);let q=n($('#prodQ')?.value);$('#prodTable').innerHTML=invRows(S.inventory.filter(p=>!q||n(`${p.name} ${p.code} ${p.ref}`).includes(q)));let A=analysis(),covered=A.reduce((a,x)=>a+Math.min(x.count,x.stock),0),def=A.reduce((a,x)=>a+x.def,0),cov=S.presales.length?Math.round(covered/S.presales.length*100):0;cards('#preCards',[['Pré-vendas',S.presales.length],['Cobertura',cov+'%'],['Faltantes',def],['Não vinculados',A.filter(x=>x.status==='unlinked').length]]);let pq=n($('#preQ')?.value),st=$('#preStatus')?.value||'all',L=A.filter(x=>(!pq||n(`${x.product} ${x.capacity} ${x.color}`).includes(pq))&&(st==='all'||x.status===st));$('#preTable').innerHTML=!L.length?'<div class="empty">Nenhuma pré-venda neste filtro.</div>':`<table><thead><tr><th>Produto</th><th>Cor</th><th>Pré-vendas</th><th>Estoque</th><th>Saldo livre</th><th>Situação</th><th>Ação</th></tr></thead><tbody>${L.map(x=>`<tr><td><b>${x.product} ${x.capacity}</b><div class="muted">${x.p?x.p.name:'Sem vínculo'}</div></td><td>${x.color}</td><td>${x.count}</td><td>${x.p?x.stock:'—'}</td><td>${x.p?x.free:'—'}</td><td class="${x.status==='good'?'good':x.status==='bad'?'bad':'warn'}">${x.status==='good'?'Atende':x.status==='bad'?'Faltam '+x.def:'Não vinculado'}</td><td>${x.def?`<button class="btn primary" onclick="request('${x.key.replace(/'/g,"\\'")}')">Solicitar ${x.def}</button>`:''}</td></tr>`).join('')}</tbody></table>`;$('#reqTable').innerHTML=!S.requests.length?'<div class="empty">Nenhuma solicitação.</div>':`<table><thead><tr><th>Produto</th><th>Filial</th><th>Quantidade</th></tr></thead><tbody>${S.requests.map(r=>`<tr><td>${r.name}</td><td>${r.store}</td><td>${r.qty}</td></tr>`).join('')}</tbody></table>`}window.request=k=>{let x=analysis().find(a=>a.key===k);if(!x||!x.p||!x.def)return;let store=prompt('Filial de origem:','Filial');if(!store)return;let qty=Number(prompt('Quantidade:',x.def))||x.def,ex=S.requests.find(r=>r.code===x.p.code&&n(r.store)===n(store));if(ex)ex.qty=qty;else S.requests.push({code:x.p.code,name:x.p.name,store,qty});save();show('requests')}function show(id){$$('.view').forEach(v=>v.classList.remove('active'));$('#'+id).classList.add('active');$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id))}$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));invFile.onchange=async e=>{let f=e.target.files[0];if(!f)return;let a=parseInv(await f.text());if(!a.length)return alert('Inventário não reconhecido.');S.inventory=a;save();alert(a.length+' produtos importados. Pré-vendas preservadas.')} ;preFile.onchange=async e=>{let f=e.target.files[0];if(!f)return;let a=csv(await f.text());if(!a.length||a[0].produto===undefined)return alert('CSV de pré-vendas não reconhecido.');S.presales=a;save();alert(a.length+' pré-vendas importadas. Inventário preservado.')} ;prodQ.oninput=render;preQ.oninput=render;preStatus.onchange=render;render();</script></body></html>

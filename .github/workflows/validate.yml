name: Validate app
on:
  push:
    branches:
      - feature/interface-profissional-v3
      - main
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check portfolio-controls.js
          node --check csv-import-controls.js
          node --check professional-ui.js
          node --check professional-polish.js
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s professional-ui.css
          grep -q 'professional-ui.css' index.html
          grep -q 'professional-ui.js' index.html
          grep -q 'professional-polish.js' index.html
